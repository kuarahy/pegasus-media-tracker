# ninja: attestations are OIDC-bound to this job, so GHA must build and upload. A local `gh release create` would ship different, unattested bytes.
name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. 1.0.1)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # ninja: review asks for provenance on the built files; manifest.json is committed source.
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # ninja: tags containing "-" (e.g. 1.2.0-beta.1) are published as pre-release
        # so they surface in BRAT but never become the "latest" release for regular users
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists (e.g. created by a concurrent dispatch run or a race with
            # a tag push). Upload the freshly-built and attested assets, overwriting any stale
            # copies so that the release assets always match the attestation records.
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes $PRERELEASE_FLAG
          fi
